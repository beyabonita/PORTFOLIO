<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <linearGradient id="certBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1122"/>
      <stop offset="100%" stop-color="#19152b"/>
    </linearGradient>
    <linearGradient id="certGoldPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <rect width="800" height="550" fill="url(#certBg)"/>
  
  <!-- Certificate Border -->
  <rect x="30" y="30" width="740" height="490" rx="12" fill="none" stroke="rgba(244,114,182,0.3)" stroke-width="2"/>
  <rect x="42" y="42" width="716" height="466" rx="8" fill="none" stroke="rgba(192,132,252,0.2)" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Ribbon badge icon -->
  <g transform="translate(400, 160)">
    <circle cx="0" cy="0" r="42" fill="rgba(244,114,182,0.12)" stroke="url(#certGoldPink)" stroke-width="2.5"/>
    <path d="M -15 25 L -22 65 L 0 50 L 22 65 L 15 25" fill="rgba(244,114,182,0.2)" stroke="#f472b6" stroke-width="1.5"/>
    <!-- Star -->
    <polygon points="0,-16 4.7,-4.7 17,-3.5 7.5,5 10.5,17 0,10.5 -10.5,17 -7.5,5 -17,-3.5 -4.7,-4.7" fill="url(#certGoldPink)"/>
  </g>

  <text x="400" y="260" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" text-anchor="middle" letter-spacing="1.5">
    CERTIFICATE OF COMPLETION
  </text>
  <text x="400" y="295" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" text-anchor="middle">
    Official Academic / Technical Training Placeholder
  </text>
  <text x="400" y="335" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle">
    Ready for your verified certificate image or credential document
  </text>
  <text x="400" y="360" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">
    Replaceable: assets/images/certificate1.jpg
  </text>

  <!-- Decorative corner accents -->
  <path d="M 60 85 L 60 60 L 85 60" fill="none" stroke="#f472b6" stroke-width="2"/>
  <path d="M 740 85 L 740 60 L 715 60" fill="none" stroke="#f472b6" stroke-width="2"/>
  <path d="M 60 465 L 60 490 L 85 490" fill="none" stroke="#f472b6" stroke-width="2"/>
  <path d="M 740 465 L 740 490 L 715 490" fill="none" stroke="#f472b6" stroke-width="2"/>
</svg>
